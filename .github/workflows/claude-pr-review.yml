# @claude-triggered AI-assisted pull request review. Not run automatically - only
# when someone comments using the trigger phrase (@claude) on a pull request.
#
# Deliberately does NOT set the `prompt` input - doing so switches
# claude-code-action into "automation mode", which runs unconditionally on every
# qualifying event and ignores trigger_phrase entirely (confirmed against the
# action's own docs/faq.md - "With prompt input: runs in automation mode -
# executes immediately without waiting for @claude mentions"). That would violate
# this project's core requirement that Claude only runs on request. Instead, this
# stays in the action's default interactive mode (mention-gated) and uses
# `claude_args --append-system-prompt` to point Claude at the orchestrator's real
# instructions - a mechanism confirmed to coexist with mention-gating, unlike
# `prompt`.
#
# GitHub identity: no GitHub App is installed for this workflow (neither the
# shared "Claude" app nor a custom one) - it runs entirely on the repository's own
# default GITHUB_TOKEN, passed explicitly as `github_token` below. The action's
# own docs describe `github_token` as needed "if using GitHub App" (i.e. it is
# how the action authenticates when no App is installed), so this is a supported
# configuration, not a workaround. The same token is also what
# tooling/pr-review/review/publish.py reads from the environment - one identity,
# the standard Actions token, for everything this workflow does.
#
# Collaborator-only triggering is still enforced by claude-code-action itself by
# default (see docs/security.md - "The action can only be triggered by users with
# write access to the repository... checked for issue, pull request, comment, and
# review events") - no need to hand-roll that check here, and unaffected by using
# the default token instead of a GitHub App.
#
# The orchestrator (this action's Claude Code session) decides which review
# skills apply, dispatches them as subagents, and hands their findings to
# tooling/pr-review/review/publish.py - the only thing that ever posts to GitHub.
# --allowedTools restricts the orchestrator's own tools so it cannot post
# anything by any other means.
#
# IMPORTANT: .claude/agents/ and .claude/skills/ are read from the pull request's
# BASE branch, not the PR's own branch (a PR cannot smuggle in different
# skill/agent behaviour for its own review) - so these files, and this workflow,
# must exist on the repository's default branch to take effect for other pull
# requests.
#
# See openspec/changes/add-pr-review-agent/design.md - Decisions 1, 3, 8, and the
# spec's collaborator-only-triggering / skill-selection / advisory-only
# requirements.

name: Claude PR review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: claude-pr-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    # Scoped to comments on a pull request specifically - issue_comment also
    # fires for plain issues, which this workflow isn't meant to engage with.
    # Whether the comment actually contains the trigger phrase, and whether its
    # author has write access, are both handled by the action itself.
    if: github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publishing pipeline dependencies
        run: pip install -r tooling/pr-review/requirements.txt

      - uses: anthropics/claude-code-action@v1
        env:
          # Read directly by tooling/pr-review/review/publish.py when the
          # orchestrator's Bash tool invokes it - the same default Actions token
          # passed as `github_token` below, so there is one GitHub identity for
          # everything this workflow does, not two.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude"
          claude_args: |
            --allowedTools "Read,Grep,Glob,Task,Bash(python -m review.publish:*)"
            --append-system-prompt "Read tooling/pr-review/orchestrator_prompt.md now, in full, and follow it exactly for the rest of this session before doing anything else."
