# Mirrors claude-pr-review/ruff.toml's rule selection for consistency across
# this repo's Python tooling.
[lint]
select = ["E", "F", "I", "S", "B"]
ignore = [
    "E501",
    "S101",  # assert-based tests are this repo's convention
]

[lint.per-file-ignores]
"**/test_*.py" = ["S101", "S105", "S106", "S107", "S108"]
"**/tests/**" = ["S101", "S105", "S106", "S107", "S108"]
