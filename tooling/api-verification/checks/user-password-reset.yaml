# Behavioural checks for the user-password-reset capability.
#
# Written from openspec/specs/user-password-reset/spec.md. A reset code is never
# returned in a response, so sequences that need one read it from the message
# delivered to the address, exactly as a recipient does. The mail catcher is
# reached through {{mailBaseUrl}}.
#
# Where the spec requires responses to be indistinguishable, the check compares
# them against each other rather than against a literal, so it verifies what the
# requirement states rather than what the implementation happens to say.
capability: user-password-reset

checks:
  - requirement: Accept a reset request
    scenario: Valid request
    sequence:
      - name: request a reset with a non-empty email address
        operation: password_reset_create
        body: {email: "pr-accept-{{runToken}}@example.com"}
        assert:
          - {status: 200}

  - requirement: Reject a reset request with no email
    scenario: Email omitted
    sequence:
      - name: request a reset with no email field
        operation: password_reset_create
        body: {}
        assert:
          - {status: 400}
          - {json_has: email}

  - requirement: Answer every reset request identically
    scenario: Registered and unregistered addresses are indistinguishable
    sequence:
      - name: create the registered account
        operation: signup_create
        body: {email: "pr-known-{{runToken}}@example.com", username: "u_prknown_{{runToken}}", password: "abcdef12"}
        assert: [{status: 200}]
      - name: request a reset for the registered address
        operation: password_reset_create
        body: {email: "pr-known-{{runToken}}@example.com"}
        save_as: registeredResetResponse
      - name: request a reset for an address with no account
        operation: password_reset_create
        body: {email: "pr-stranger-{{runToken}}@example.com"}
        assert:
          - {same_as: registeredResetResponse}

  - requirement: Answer every reset request identically
    scenario: Reset request response shape
    sequence:
      - name: request a reset with a well-formed address, under the limit
        operation: password_reset_create
        body: {email: "pr-shape-{{runToken}}@example.com"}
        assert:
          - {status: 200}

  - requirement: Deliver a reset code to a registered address
    scenario: Code delivered to the account holder
    sequence:
      - name: create the account
        operation: signup_create
        body: {email: "pr-deliver-{{runToken}}@example.com", username: "u_prdeliver_{{runToken}}", password: "abcdef12"}
        assert: [{status: 200}]
      - name: request a reset
        operation: password_reset_create
        body: {email: "pr-deliver-{{runToken}}@example.com"}
        assert: [{status: 200}]
      - name: a message was delivered to that address
        url: "{{mailBaseUrl}}/api/v1/search?query=to%3Apr-deliver-{{runToken}}%40example.com"
        capture:
          - {var: deliverMessageId, json: "messages.0.ID"}
        assert:
          - {status: 200}
          - {json_equals: {path: messages_count, value: 1}}
      - name: the message carries a link that carries a reset code
        url: "{{mailBaseUrl}}/api/v1/message/{{deliverMessageId}}"
        assert:
          - {status: 200}
          - {body_includes: "/reset-password/"}

  - requirement: Deliver the reset link as an absolute address
    scenario: Link is followable as sent
    sequence:
      - name: create the account
        operation: signup_create
        body: {email: "pr-abs-{{runToken}}@example.com", username: "u_prabs_{{runToken}}", password: "abcdef12"}
        assert: [{status: 200}]
      - name: request a reset
        operation: password_reset_create
        body: {email: "pr-abs-{{runToken}}@example.com"}
        assert: [{status: 200}]
      - name: find the delivered message
        url: "{{mailBaseUrl}}/api/v1/search?query=to%3Apr-abs-{{runToken}}%40example.com"
        capture:
          - {var: absMessageId, json: "messages.0.ID"}
      - name: the link includes a scheme and a host, not a bare path
        url: "{{mailBaseUrl}}/api/v1/message/{{absMessageId}}"
        assert:
          - {body_includes: "http://"}
          - {body_includes: "/reset-password/"}

  - requirement: Deliver nothing to an unregistered address
    scenario: No mail to a stranger
    sequence:
      - name: request a reset for an address with no account
        operation: password_reset_create
        body: {email: "pr-nomail-{{runToken}}@example.com"}
        assert: [{status: 200}]
      - name: no message was delivered to that address
        url: "{{mailBaseUrl}}/api/v1/search?query=to%3Apr-nomail-{{runToken}}%40example.com"
        assert:
          - {status: 200}
          - {json_equals: {path: messages_count, value: 0}}

  - requirement: Limit how often a reset may be requested for one address
    scenario: Two refusals are indistinguishable
    sequence:
      - name: first request, under the limit
        operation: password_reset_create
        body: {email: "pr-lim1-{{runToken}}@example.com"}
      - name: second request
        operation: password_reset_create
        body: {email: "pr-lim1-{{runToken}}@example.com"}
      - name: third request
        operation: password_reset_create
        body: {email: "pr-lim1-{{runToken}}@example.com"}
      - name: fourth request
        operation: password_reset_create
        body: {email: "pr-lim1-{{runToken}}@example.com"}
      - name: fifth request, the last the limit allows
        operation: password_reset_create
        body: {email: "pr-lim1-{{runToken}}@example.com"}
      - name: first refusal by the limit
        operation: password_reset_create
        body: {email: "pr-lim1-{{runToken}}@example.com"}
        save_as: firstLimitRefusal
        assert:
          - {status: 429}
          - {header_absent: Retry-After}
      - name: second refusal, at a different moment
        operation: password_reset_create
        body: {email: "pr-lim1-{{runToken}}@example.com"}
        assert:
          - {same_as: firstLimitRefusal}
          - {header_absent: Retry-After}

  - requirement: Limit how often a reset may be requested for one address
    scenario: Requests beyond the limit are not acted on
    sequence:
      - name: create the account
        operation: signup_create
        body: {email: "pr-lim2-{{runToken}}@example.com", username: "u_prlim2_{{runToken}}", password: "abcdef12"}
        assert: [{status: 200}]
      - name: request one
        operation: password_reset_create
        body: {email: "pr-lim2-{{runToken}}@example.com"}
      - name: request two
        operation: password_reset_create
        body: {email: "pr-lim2-{{runToken}}@example.com"}
      - name: request three
        operation: password_reset_create
        body: {email: "pr-lim2-{{runToken}}@example.com"}
      - name: request four
        operation: password_reset_create
        body: {email: "pr-lim2-{{runToken}}@example.com"}
      - name: request five, the last the limit allows
        operation: password_reset_create
        body: {email: "pr-lim2-{{runToken}}@example.com"}
      - name: count the messages delivered while under the limit
        url: "{{mailBaseUrl}}/api/v1/search?query=to%3Apr-lim2-{{runToken}}%40example.com"
        assert:
          - {json_equals: {path: messages_count, value: 5}}
      - name: a sixth request, beyond the limit
        operation: password_reset_create
        body: {email: "pr-lim2-{{runToken}}@example.com"}
        assert: [{status: 429}]
      - name: no further message was delivered for that address
        url: "{{mailBaseUrl}}/api/v1/search?query=to%3Apr-lim2-{{runToken}}%40example.com"
        assert:
          - {json_equals: {path: messages_count, value: 5}}

  - requirement: Limit how often a reset may be requested for one address
    scenario: A flood cannot leave an address with no usable code
    sequence:
      - name: create the account
        operation: signup_create
        body: {email: "pr-flood-{{runToken}}@example.com", username: "u_prflood_{{runToken}}", password: "abcdef12"}
        assert: [{status: 200}]
      - name: request one
        operation: password_reset_create
        body: {email: "pr-flood-{{runToken}}@example.com"}
      - name: request two
        operation: password_reset_create
        body: {email: "pr-flood-{{runToken}}@example.com"}
      - name: request three
        operation: password_reset_create
        body: {email: "pr-flood-{{runToken}}@example.com"}
      - name: request four
        operation: password_reset_create
        body: {email: "pr-flood-{{runToken}}@example.com"}
      - name: request five, reaching the limit
        operation: password_reset_create
        body: {email: "pr-flood-{{runToken}}@example.com"}
      - name: a sixth request is refused
        operation: password_reset_create
        body: {email: "pr-flood-{{runToken}}@example.com"}
        assert: [{status: 429}]
      - name: find the most recently delivered message
        url: "{{mailBaseUrl}}/api/v1/search?query=to%3Apr-flood-{{runToken}}%40example.com"
        capture:
          - {var: floodMessageId, json: "messages.0.ID"}
      - name: read the most recently delivered code
        url: "{{mailBaseUrl}}/api/v1/message/{{floodMessageId}}"
        capture:
          - {var: floodCode, regex: "/reset-password/([^/\\s\"'<>]+)/"}
      - name: the most recently delivered code is still usable
        operation: password_reset_confirm_create
        body: {code: "{{floodCode}}", password: "newpass12"}
        assert:
          - {status: 200}

  - requirement: Limit how often a reset may be requested for one address
    scenario: Reaching the limit does not reveal whether an account exists
    sequence:
      - name: create the registered account
        operation: signup_create
        body: {email: "pr-lim3-{{runToken}}@example.com", username: "u_prlim3_{{runToken}}", password: "abcdef12"}
        assert: [{status: 200}]
      - name: registered, request one
        operation: password_reset_create
        body: {email: "pr-lim3-{{runToken}}@example.com"}
      - name: registered, request two
        operation: password_reset_create
        body: {email: "pr-lim3-{{runToken}}@example.com"}
      - name: registered, request three
        operation: password_reset_create
        body: {email: "pr-lim3-{{runToken}}@example.com"}
      - name: registered, request four
        operation: password_reset_create
        body: {email: "pr-lim3-{{runToken}}@example.com"}
      - name: registered, request five
        operation: password_reset_create
        body: {email: "pr-lim3-{{runToken}}@example.com"}
      - name: registered, refused by the limit
        operation: password_reset_create
        body: {email: "pr-lim3-{{runToken}}@example.com"}
        save_as: registeredLimitRefusal
        assert: [{status: 429}]
      - name: unregistered, request one
        operation: password_reset_create
        body: {email: "pr-lim4-{{runToken}}@example.com"}
      - name: unregistered, request two
        operation: password_reset_create
        body: {email: "pr-lim4-{{runToken}}@example.com"}
      - name: unregistered, request three
        operation: password_reset_create
        body: {email: "pr-lim4-{{runToken}}@example.com"}
      - name: unregistered, request four
        operation: password_reset_create
        body: {email: "pr-lim4-{{runToken}}@example.com"}
      - name: unregistered, request five
        operation: password_reset_create
        body: {email: "pr-lim4-{{runToken}}@example.com"}
      - name: unregistered, refused by the limit
        operation: password_reset_create
        body: {email: "pr-lim4-{{runToken}}@example.com"}
        assert:
          - {same_as: registeredLimitRefusal}

  - requirement: Never return the reset code in a response
    scenario: Code absent from the request response
    sequence:
      - name: create the account
        operation: signup_create
        body: {email: "pr-nocode-{{runToken}}@example.com", username: "u_prnocode_{{runToken}}", password: "abcdef12"}
        assert: [{status: 200}]
      - name: request a reset, keeping the response for comparison
        operation: password_reset_create
        body: {email: "pr-nocode-{{runToken}}@example.com"}
        save_as: resetRequestResponse
        assert: [{status: 200}]
      - name: find the delivered message
        url: "{{mailBaseUrl}}/api/v1/search?query=to%3Apr-nocode-{{runToken}}%40example.com"
        capture:
          - {var: nocodeMessageId, json: "messages.0.ID"}
      - name: read the delivered code
        url: "{{mailBaseUrl}}/api/v1/message/{{nocodeMessageId}}"
        capture:
          - {var: nocodeCode, regex: "/reset-password/([^/\\s\"'<>]+)/"}
      - name: the reset request response carried neither the code nor its link
        url: "{{mailBaseUrl}}/api/v1/message/{{nocodeMessageId}}"
        assert:
          - {saved_excludes: {saved: resetRequestResponse, value: "{{nocodeCode}}"}}
          - {saved_excludes: {saved: resetRequestResponse, value: "/reset-password/"}}

  - requirement: Serve a page at the delivered link
    scenario: A usable link opens a form
    sequence:
      - name: create the account
        operation: signup_create
        body: {email: "pg-open-{{runToken}}@example.com", username: "u_pgopen_{{runToken}}", password: "abcdef12"}
        assert: [{status: 200}]
      - name: request a reset
        operation: password_reset_create
        body: {email: "pg-open-{{runToken}}@example.com"}
        assert: [{status: 200}]
      - name: find the delivered message
        url: "{{mailBaseUrl}}/api/v1/search?query=to%3Apg-open-{{runToken}}%40example.com"
        capture: [{var: pgOpenMessageId, json: "messages.0.ID"}]
      - name: read the delivered code
        url: "{{mailBaseUrl}}/api/v1/message/{{pgOpenMessageId}}"
        capture: [{var: pgOpenCode, regex: "/reset-password/([^/\\s\"'<>]+)/"}]
      - name: following the link returns a page offering a form
        surface: {path: "/reset-password/<str:code>/", method: GET}
        path_params: {code: "{{pgOpenCode}}"}
        assert:
          - {status: 200}
          - {body_includes: "<form"}
          - {body_includes: "name=\"password\""}

  - requirement: Serve a page at the delivered link
    scenario: The form asks for the new password twice
    sequence:
      - name: create the account
        operation: signup_create
        body: {email: "pg-twice-{{runToken}}@example.com", username: "u_pgtwice_{{runToken}}", password: "abcdef12"}
        assert: [{status: 200}]
      - name: request a reset
        operation: password_reset_create
        body: {email: "pg-twice-{{runToken}}@example.com"}
        assert: [{status: 200}]
      - name: find the delivered message
        url: "{{mailBaseUrl}}/api/v1/search?query=to%3Apg-twice-{{runToken}}%40example.com"
        capture: [{var: pgTwiceMessageId, json: "messages.0.ID"}]
      - name: read the delivered code
        url: "{{mailBaseUrl}}/api/v1/message/{{pgTwiceMessageId}}"
        capture: [{var: pgTwiceCode, regex: "/reset-password/([^/\\s\"'<>]+)/"}]
      - name: the form offers two separate entries for the new password
        surface: {path: "/reset-password/<str:code>/", method: GET}
        path_params: {code: "{{pgTwiceCode}}"}
        assert:
          - {status: 200}
          - {body_count: {pattern: "<input type=\"password\"", count: 2}}

  - requirement: Serve a page at the delivered link
    scenario: Submitting the form completes the reset
    sequence:
      - name: create the account
        operation: signup_create
        body: {email: "pg-submit-{{runToken}}@example.com", username: "u_pgsubmit_{{runToken}}", password: "abcdef12"}
        assert: [{status: 200}]
      - name: request a reset
        operation: password_reset_create
        body: {email: "pg-submit-{{runToken}}@example.com"}
        assert: [{status: 200}]
      - name: find the delivered message
        url: "{{mailBaseUrl}}/api/v1/search?query=to%3Apg-submit-{{runToken}}%40example.com"
        capture: [{var: pgSubmitMessageId, json: "messages.0.ID"}]
      - name: read the delivered code
        url: "{{mailBaseUrl}}/api/v1/message/{{pgSubmitMessageId}}"
        capture: [{var: pgSubmitCode, regex: "/reset-password/([^/\\s\"'<>]+)/"}]
      - name: submit the form with an acceptable password in both entries
        surface: {path: "/reset-password/<str:code>/", method: POST}
        path_params: {code: "{{pgSubmitCode}}"}
        form: {password: "brandnew12", confirm_password: "brandnew12"}
        assert: [{status: 200}]
      - name: the account authenticates with the new password
        operation: signin_create
        body: {email_or_username: "pg-submit-{{runToken}}@example.com", password: "brandnew12"}
        assert:
          - {status: 200}

  - requirement: Serve a page at the delivered link
    scenario: An unusable link says so and offers no form
    sequence:
      - name: following an unrecognised link reports the link cannot be used
        surface: {path: "/reset-password/<str:code>/", method: GET}
        path_params: {code: "not-a-real-code-{{runToken}}"}
        save_as: unrecognisedLinkPage
        assert:
          - {body_excludes: "name=\"password\""}

  - requirement: Serve a page at the delivered link
    scenario: A weak password keeps the form open
    sequence:
      - name: create the account
        operation: signup_create
        body: {email: "pg-weak-{{runToken}}@example.com", username: "u_pgweak_{{runToken}}", password: "abcdef12"}
        assert: [{status: 200}]
      - name: request a reset
        operation: password_reset_create
        body: {email: "pg-weak-{{runToken}}@example.com"}
        assert: [{status: 200}]
      - name: find the delivered message
        url: "{{mailBaseUrl}}/api/v1/search?query=to%3Apg-weak-{{runToken}}%40example.com"
        capture: [{var: pgWeakMessageId, json: "messages.0.ID"}]
      - name: read the delivered code
        url: "{{mailBaseUrl}}/api/v1/message/{{pgWeakMessageId}}"
        capture: [{var: pgWeakCode, regex: "/reset-password/([^/\\s\"'<>]+)/"}]
      - name: submit a weak password identically in both entries
        surface: {path: "/reset-password/<str:code>/", method: POST}
        path_params: {code: "{{pgWeakCode}}"}
        form: {password: "abc", confirm_password: "abc"}
        assert:
          - {body_includes: "name=\"password\""}
      - name: the account keeps the password it had
        operation: signin_create
        body: {email_or_username: "pg-weak-{{runToken}}@example.com", password: "abcdef12"}
        assert:
          - {status: 200}

  - requirement: Require the two password entries to match
    scenario: A mismatch is reported and changes nothing
    sequence:
      - name: create the account
        operation: signup_create
        body: {email: "pg-mm-{{runToken}}@example.com", username: "u_pgmm_{{runToken}}", password: "abcdef12"}
        assert: [{status: 200}]
      - name: request a reset
        operation: password_reset_create
        body: {email: "pg-mm-{{runToken}}@example.com"}
        assert: [{status: 200}]
      - name: find the delivered message
        url: "{{mailBaseUrl}}/api/v1/search?query=to%3Apg-mm-{{runToken}}%40example.com"
        capture: [{var: pgMmMessageId, json: "messages.0.ID"}]
      - name: read the delivered code
        url: "{{mailBaseUrl}}/api/v1/message/{{pgMmMessageId}}"
        capture: [{var: pgMmCode, regex: "/reset-password/([^/\\s\"'<>]+)/"}]
      - name: submit two entries that differ
        surface: {path: "/reset-password/<str:code>/", method: POST}
        path_params: {code: "{{pgMmCode}}"}
        form: {password: "brandnew12", confirm_password: "different12"}
        save_as: mismatchPage
        assert:
          - {body_includes: "not match"}
      - name: the account still authenticates with the password it had
        operation: signin_create
        body: {email_or_username: "pg-mm-{{runToken}}@example.com", password: "abcdef12"}
        assert:
          - {status: 200}

  - requirement: Require the two password entries to match
    scenario: A mismatch keeps the form open
    sequence:
      - name: create the account
        operation: signup_create
        body: {email: "pg-mm2-{{runToken}}@example.com", username: "u_pgmm2_{{runToken}}", password: "abcdef12"}
        assert: [{status: 200}]
      - name: request a reset
        operation: password_reset_create
        body: {email: "pg-mm2-{{runToken}}@example.com"}
        assert: [{status: 200}]
      - name: find the delivered message
        url: "{{mailBaseUrl}}/api/v1/search?query=to%3Apg-mm2-{{runToken}}%40example.com"
        capture: [{var: pgMm2MessageId, json: "messages.0.ID"}]
      - name: read the delivered code
        url: "{{mailBaseUrl}}/api/v1/message/{{pgMm2MessageId}}"
        capture: [{var: pgMm2Code, regex: "/reset-password/([^/\\s\"'<>]+)/"}]
      - name: submit two entries that differ
        surface: {path: "/reset-password/<str:code>/", method: POST}
        path_params: {code: "{{pgMm2Code}}"}
        form: {password: "brandnew12", confirm_password: "different12"}
        assert:
          - {body_includes: "<form"}
          - {body_includes: "name=\"password\""}

  - requirement: Require the two password entries to match
    scenario: A mismatch does not spend the reset link
    sequence:
      - name: create the account
        operation: signup_create
        body: {email: "pg-mm3-{{runToken}}@example.com", username: "u_pgmm3_{{runToken}}", password: "abcdef12"}
        assert: [{status: 200}]
      - name: request a reset
        operation: password_reset_create
        body: {email: "pg-mm3-{{runToken}}@example.com"}
        assert: [{status: 200}]
      - name: find the delivered message
        url: "{{mailBaseUrl}}/api/v1/search?query=to%3Apg-mm3-{{runToken}}%40example.com"
        capture: [{var: pgMm3MessageId, json: "messages.0.ID"}]
      - name: read the delivered code
        url: "{{mailBaseUrl}}/api/v1/message/{{pgMm3MessageId}}"
        capture: [{var: pgMm3Code, regex: "/reset-password/([^/\\s\"'<>]+)/"}]
      - name: submit two entries that differ
        surface: {path: "/reset-password/<str:code>/", method: POST}
        path_params: {code: "{{pgMm3Code}}"}
        form: {password: "brandnew12", confirm_password: "different12"}
      - name: following the same link again still offers a form
        surface: {path: "/reset-password/<str:code>/", method: GET}
        path_params: {code: "{{pgMm3Code}}"}
        assert:
          - {status: 200}
          - {body_includes: "name=\"password\""}

  - requirement: Require the two password entries to match
    scenario: A second entry left empty is a mismatch
    sequence:
      - name: create the account
        operation: signup_create
        body: {email: "pg-mm4-{{runToken}}@example.com", username: "u_pgmm4_{{runToken}}", password: "abcdef12"}
        assert: [{status: 200}]
      - name: request a reset
        operation: password_reset_create
        body: {email: "pg-mm4-{{runToken}}@example.com"}
        assert: [{status: 200}]
      - name: find the delivered message
        url: "{{mailBaseUrl}}/api/v1/search?query=to%3Apg-mm4-{{runToken}}%40example.com"
        capture: [{var: pgMm4MessageId, json: "messages.0.ID"}]
      - name: read the delivered code
        url: "{{mailBaseUrl}}/api/v1/message/{{pgMm4MessageId}}"
        capture: [{var: pgMm4Code, regex: "/reset-password/([^/\\s\"'<>]+)/"}]
      - name: submit a password in the first entry and nothing in the second
        surface: {path: "/reset-password/<str:code>/", method: POST}
        path_params: {code: "{{pgMm4Code}}"}
        form: {password: "brandnew12", confirm_password: ""}
      - name: the account still authenticates with the password it had
        operation: signin_create
        body: {email_or_username: "pg-mm4-{{runToken}}@example.com", password: "abcdef12"}
        assert:
          - {status: 200}

  - requirement: Report a mismatch before judging the password
    scenario: A mismatch is reported ahead of a strength complaint
    sequence:
      - name: create the account
        operation: signup_create
        body: {email: "pg-ord-{{runToken}}@example.com", username: "u_pgord_{{runToken}}", password: "abcdef12"}
        assert: [{status: 200}]
      - name: request a reset
        operation: password_reset_create
        body: {email: "pg-ord-{{runToken}}@example.com"}
        assert: [{status: 200}]
      - name: find the delivered message
        url: "{{mailBaseUrl}}/api/v1/search?query=to%3Apg-ord-{{runToken}}%40example.com"
        capture: [{var: pgOrdMessageId, json: "messages.0.ID"}]
      - name: read the delivered code
        url: "{{mailBaseUrl}}/api/v1/message/{{pgOrdMessageId}}"
        capture: [{var: pgOrdCode, regex: "/reset-password/([^/\\s\"'<>]+)/"}]
      - name: submit differing entries whose first is also too weak
        surface: {path: "/reset-password/<str:code>/", method: POST}
        path_params: {code: "{{pgOrdCode}}"}
        form: {password: "abc", confirm_password: "different12"}
        assert:
          - {body_includes: "not match"}
          - {body_excludes: "8 characters"}

  - requirement: Report a mismatch before judging the password
    scenario: Strength is still judged once the entries match
    sequence:
      - name: create the account
        operation: signup_create
        body: {email: "pg-ord2-{{runToken}}@example.com", username: "u_pgord2_{{runToken}}", password: "abcdef12"}
        assert: [{status: 200}]
      - name: request a reset
        operation: password_reset_create
        body: {email: "pg-ord2-{{runToken}}@example.com"}
        assert: [{status: 200}]
      - name: find the delivered message
