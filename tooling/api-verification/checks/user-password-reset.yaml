  - requirement: Decide the link before the password
    scenario: A dead link is refused rather than reporting a mismatch
    sequence:
      # A submission to a dead link still has to look like one a browser makes:
      # the page's form carries a CSRF token, and a dead link renders no form to
      # take one from. These four steps put the run in the state a person is in
      # when they reach a dead link - having already been served a usable page.
      - name: create an account so a usable page can be served
        operation: signup_create
        body: {email: "pg-dead-{{runToken}}@example.com", username: "u_pgdead_{{runToken}}", password: "abcdef12"}
        assert: [{status: 200}]
      - name: request a reset for it
        operation: password_reset_create
        body: {email: "pg-dead-{{runToken}}@example.com"}
        assert: [{status: 200}]
      - name: find the delivered message
        url: "{{mailBaseUrl}}/api/v1/search?query=to%3Apg-dead-{{runToken}}%40example.com"
        capture: [{var: pgDeadMessageId, json: "messages.0.ID"}]
      - name: read the delivered code
        url: "{{mailBaseUrl}}/api/v1/message/{{pgDeadMessageId}}"
        capture: [{var: pgDeadCode, regex: "/reset-password/([^/\\s\"'<>]+)/"}]
      - name: be served a usable page, as a person following their link would be
        surface: {path: "/reset-password/<str:code>/", method: GET}
        path_params: {code: "{{pgDeadCode}}"}
        assert: [{status: 200}]
      - name: an unrecognised link, followed, reports the refusal
        surface: {path: "/reset-password/<str:code>/", method: GET}
        path_params: {code: "dead-code-{{runToken}}"}
        save_as: deadLinkPage
      - name: submitting differing entries to a dead link reports the same refusal
        surface: {path: "/reset-password/<str:code>/", method: POST}
        path_params: {code: "dead-code-{{runToken}}"}
        form: {password: "brandnew12", confirm_password: "different12"}
        assert:
          - {same_as: deadLinkPage}
          - {body_excludes: "name=\"password\""}

