[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP server exposing signup-reporting tools backed by this project's Django API."
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.0.2",
    "httpx2==2.12.0",
    "mcp==2.1.1",
    "mcp-types==2.1.1",
    "python-dotenv==1.2.3",
    "starlette==1.6.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "middleware", "validation", "config", "auth", "elicitation"]

[tool.setuptools.packages.find]
where = ["."]
include = ["clients*", "tools*"]
